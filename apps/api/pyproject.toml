# pyproject.toml — tooling configuration only (no build system).
#
# Ruff replaces black + isort + flake8 with one fast Rust binary.
# Pytest config lives here rather than in a separate pytest.ini.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Enable a strict, opinionated ruleset. Add rules as we grow.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"          # `async def test_...` works without @mark.
testpaths = ["tests"]
python_files = ["test_*.py"]
