name: CI

on:
  pull_request:
  push:
    branches: [main, claude]

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          # Fixed local Supabase CLI demo values (public, not secrets) --
          # `next build` needs *some* value for these to compile, it
          # never actually connects to them during a build.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8012
          DOCUMENT_ENCRYPTION_KEY: ${{ secrets.CI_DOCUMENT_ENCRYPTION_KEY }}

  backend:
    name: Backend (ruff, pytest against local Supabase)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python -m ruff check .

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        working-directory: .
        run: supabase start

      - name: Run pytest
        env:
          APP_ENV: local
          HOST: 127.0.0.1
          PORT: "8012"
          CORS_ORIGINS: '["http://localhost:3000"]'
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          DOCUMENT_ENCRYPTION_KEY: ${{ secrets.CI_DOCUMENT_ENCRYPTION_KEY }}
          INTERNAL_API_SECRET: ci-placeholder-internal-secret
        run: python -m pytest